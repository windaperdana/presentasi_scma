<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentasi MIS SCMA IT MIS - 2026-08-06</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr auto auto;
            height: calc(100vh - 40px);
        }

        .header {
            background: #1976d2;
            color: white;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            flex: 1;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.95;
            font-weight: 400;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 0;
            overflow: hidden;
            background: #fafafa;
        }

        .thumbnail-sidebar {
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            padding: 15px 10px;
        }

        .thumbnail-sidebar::-webkit-scrollbar {
            width: 8px;
        }

        .thumbnail-sidebar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .thumbnail-sidebar::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        .thumbnail {
            margin-bottom: 12px;
            cursor: pointer;
            border-radius: 6px;
            overflow: hidden;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            position: relative;
        }

        .thumbnail:hover {
            border-color: #90caf9;
            transform: scale(1.02);
        }

        .thumbnail.active {
            border-color: #1976d2;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
        }

        .thumbnail img {
            width: 100%;
            height: auto;
            display: block;
        }

        .thumbnail-number {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .slide-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            overflow: hidden;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        .slide.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(25, 118, 210, 0.2);
        }

        button:hover {
            background: #1565c0;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #e0e0e0;
            color: #9e9e9e;
            cursor: not-allowed;
            box-shadow: none;
        }

        .slide-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #424242;
            padding: 8px 16px;
            background: #f5f5f5;
            border-radius: 6px;
        }

        .slide-counter .current {
            color: #1976d2;
            font-size: 20px;
            font-weight: 700;
        }

        .slide-counter .total {
            color: #757575;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            padding: 8px 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .keyboard-hint {
            text-align: center;
            padding: 12px;
            background: #f8f9fa;
            color: #616161;
            font-size: 12px;
            border-top: 1px solid #e0e0e0;
        }

        .keyboard-hint kbd {
            background: white;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #d0d0d0;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-weight: 600;
            font-size: 11px;
            margin: 0 2px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 150px 1fr;
            }
        }

        @media (max-width: 768px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            body {
                padding: 0;
            }

            .main-layout {
                grid-template-columns: 1fr;
            }

            .thumbnail-sidebar {
                display: none;
            }

            .header {
                padding: 16px 20px;
            }

            .header h1 {
                font-size: 18px;
            }

            .header p {
                font-size: 12px;
            }

            .controls {
                flex-direction: column;
                gap: 12px;
                padding: 16px 20px;
            }

            .nav-buttons {
                width: 100%;
                justify-content: space-between;
            }

            button {
                padding: 10px 16px;
                font-size: 13px;
            }

            .slide-counter {
                font-size: 13px;
            }

            .action-buttons {
                width: 100%;
                justify-content: center;
            }

            .keyboard-hint {
                font-size: 11px;
                padding: 10px;
            }
        }

        /* Loading state */
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .spinner {
            border: 4px solid #e3f2fd;
            border-top: 4px solid #1976d2;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Progress bar */
        .progress-bar {
            height: 3px;
            background: #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #1976d2;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>📊 Presentasi MIS SCMA IT MIS</h1>
                <p>Tanggal: 6 Agustus 2026</p>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 12.5%"></div>
        </div>

        <div class="main-layout">
            <!-- Thumbnail Sidebar -->
            <div class="thumbnail-sidebar">
                <div class="thumbnail active" data-slide="1" onclick="goToSlide(1)">
                    <img src="assets/image1.png" alt="Slide 1">
                    <div class="thumbnail-number">1</div>
                </div>
                <div class="thumbnail" data-slide="2" onclick="goToSlide(2)">
                    <img src="assets/image2.png" alt="Slide 2">
                    <div class="thumbnail-number">2</div>
                </div>
                <div class="thumbnail" data-slide="3" onclick="goToSlide(3)">
                    <img src="assets/image3.png" alt="Slide 3">
                    <div class="thumbnail-number">3</div>
                </div>
                <div class="thumbnail" data-slide="4" onclick="goToSlide(4)">
                    <img src="assets/image4.png" alt="Slide 4">
                    <div class="thumbnail-number">4</div>
                </div>
                <div class="thumbnail" data-slide="5" onclick="goToSlide(5)">
                    <img src="assets/image5.png" alt="Slide 5">
                    <div class="thumbnail-number">5</div>
                </div>
                <div class="thumbnail" data-slide="6" onclick="goToSlide(6)">
                    <img src="assets/image6.jpeg" alt="Slide 6">
                    <div class="thumbnail-number">6</div>
                </div>
                <div class="thumbnail" data-slide="7" onclick="goToSlide(7)">
                    <img src="assets/image7.png" alt="Slide 7">
                    <div class="thumbnail-number">7</div>
                </div>
                <div class="thumbnail" data-slide="8" onclick="goToSlide(8)">
                    <img src="assets/image8.png" alt="Slide 8">
                    <div class="thumbnail-number">8</div>
                </div>
            </div>

            <!-- Main Slide Container -->
            <div class="slide-container">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
                
                <div class="slide active" data-slide="1">
                    <img src="assets/image1.png" alt="Slide 1" loading="eager">
                </div>
                <div class="slide" data-slide="2">
                    <img src="assets/image2.png" alt="Slide 2" loading="lazy">
                </div>
                <div class="slide" data-slide="3">
                    <img src="assets/image3.png" alt="Slide 3" loading="lazy">
                </div>
                <div class="slide" data-slide="4">
                    <img src="assets/image4.png" alt="Slide 4" loading="lazy">
                </div>
                <div class="slide" data-slide="5">
                    <img src="assets/image5.png" alt="Slide 5" loading="lazy">
                </div>
                <div class="slide" data-slide="6">
                    <img src="assets/image6.jpeg" alt="Slide 6" loading="lazy">
                </div>
                <div class="slide" data-slide="7">
                    <img src="assets/image7.png" alt="Slide 7" loading="lazy">
                </div>
                <div class="slide" data-slide="8">
                    <img src="assets/image8.png" alt="Slide 8" loading="lazy">
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="nav-buttons">
                <button id="prevBtn" onclick="changeSlide(-1)" title="Slide sebelumnya">
                    ← Sebelumnya
                </button>
                <button id="nextBtn" onclick="changeSlide(1)" title="Slide selanjutnya">
                    Selanjutnya →
                </button>
            </div>
            
            <div class="slide-counter">
                <span class="current" id="currentSlide">1</span> 
                <span class="separator">/</span>
                <span class="total" id="totalSlides">8</span>
            </div>

            <div class="action-buttons">
                <button class="icon-btn" onclick="toggleFullscreen()" title="Mode layar penuh">
                    ⛶ Fullscreen
                </button>
            </div>
        </div>

        <div class="keyboard-hint">
            💡 Gunakan <kbd>←</kbd> <kbd>→</kbd> navigasi | <kbd>Home</kbd> slide pertama | <kbd>End</kbd> slide terakhir | <kbd>F</kbd> fullscreen
        </div>
    </div>

    <script>
        let currentSlide = 1;
        const totalSlides = 8;

        // Initialize
        document.getElementById('totalSlides').textContent = totalSlides;
        updateSlideDisplay();

        function changeSlide(direction) {
            const slides = document.querySelectorAll('.slide');
            const thumbnails = document.querySelectorAll('.thumbnail');
            
            slides[currentSlide - 1].classList.remove('active');
            thumbnails[currentSlide - 1].classList.remove('active');
            
            currentSlide += direction;
            
            // Loop around
            if (currentSlide > totalSlides) {
                currentSlide = 1;
            } else if (currentSlide < 1) {
                currentSlide = totalSlides;
            }
            
            slides[currentSlide - 1].classList.add('active');
            thumbnails[currentSlide - 1].classList.add('active');
            updateSlideDisplay();
            scrollThumbnailIntoView();
        }

        function goToSlide(slideNumber) {
            if (slideNumber < 1 || slideNumber > totalSlides || slideNumber === currentSlide) return;
            
            const slides = document.querySelectorAll('.slide');
            const thumbnails = document.querySelectorAll('.thumbnail');
            
            slides[currentSlide - 1].classList.remove('active');
            thumbnails[currentSlide - 1].classList.remove('active');
            
            currentSlide = slideNumber;
            
            slides[currentSlide - 1].classList.add('active');
            thumbnails[currentSlide - 1].classList.add('active');
            updateSlideDisplay();
            scrollThumbnailIntoView();
        }

        function updateSlideDisplay() {
            document.getElementById('currentSlide').textContent = currentSlide;
            
            // Update progress bar
            const progress = (currentSlide / totalSlides) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            // Update button states (optional - remove if you want continuous loop)
            // document.getElementById('prevBtn').disabled = currentSlide === 1;
            // document.getElementById('nextBtn').disabled = currentSlide === totalSlides;
        }

        function scrollThumbnailIntoView() {
            const activeThumbnail = document.querySelector('.thumbnail.active');
            if (activeThumbnail) {
                activeThumbnail.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest'
                });
            }
        }

        function toggleFullscreen() {
            const container = document.querySelector('.container');
            
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    alert(`Error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            switch(event.key) {
                case 'ArrowLeft':
                case 'PageUp':
                    event.preventDefault();
                    changeSlide(-1);
                    break;
                case 'ArrowRight':
                case 'PageDown':
                case ' ':
                    event.preventDefault();
                    changeSlide(1);
                    break;
                case 'Home':
                    event.preventDefault();
                    goToSlide(1);
                    break;
                case 'End':
                    event.preventDefault();
                    goToSlide(totalSlides);
                    break;
                case 'f':
                case 'F':
                    event.preventDefault();
                    toggleFullscreen();
                    break;
                case 'Escape':
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                    break;
            }
        });

        // Number keys for quick navigation
        document.addEventListener('keydown', function(event) {
            const num = parseInt(event.key);
            if (num >= 1 && num <= totalSlides) {
                goToSlide(num);
            }
        });

        // Touch swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;
        let touchStartY = 0;
        let touchEndY = 0;

        const slideContainer = document.querySelector('.slide-container');

        slideContainer.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, { passive: true });

        slideContainer.addEventListener('touchend', function(event) {
            touchEndX = event.changedTouches[0].screenX;
            touchEndY = event.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            
            // Only handle horizontal swipes (ignore vertical scrolling)
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX < -50) {
                    // Swipe left - next slide
                    changeSlide(1);
                } else if (deltaX > 50) {
                    // Swipe right - previous slide
                    changeSlide(-1);
                }
            }
        }

        // Preload images for smoother transitions
        window.addEventListener('load', function() {
            const images = document.querySelectorAll('.slide img');
            images.forEach(img => {
                const newImg = new Image();
                newImg.src = img.src;
            });
        });

        // Handle visibility change to pause/resume
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                console.log('Presentation paused');
            } else {
                console.log('Presentation resumed');
            }
        });
    </script>
</body>
</html>
